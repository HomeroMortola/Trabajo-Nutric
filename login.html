<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identificación — Evaluación Sensorial</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<div class="card">
  <div class="logo-row">
    <div class="logo-icon"><i class="ti ti-leaf"></i></div>
    <div>
      <div class="logo-text">Evaluación Sensorial</div>
      <div class="logo-sub">Tartaleta Integral Nutritiva</div>
    </div>
  </div>

  <h2>Identificación</h2>
  <p class="subtitle">Completá tus datos para comenzar la evaluación</p>

  <div class="row">
    <div class="field">
      <label>Nombre</label>
      <input type="text" id="nombre" placeholder="María">
    </div>
    <div class="field">
      <label>Apellido</label>
      <input type="text" id="apellido" placeholder="García">
    </div>
  </div>

  <div class="field">
    <label>Año</label>
    <select id="curso">
      <option value="" disabled selected>Seleccioná tu año</option>
      <option>1° año</option>
      <option>2° año</option>
      <option>3° año</option>
      <option>4° año</option>
      <option>5° año</option>
    </select>
  </div>

  <div class="field">
    <label>Carrera</label>
    <select id="carrera">
      <option value="" disabled selected>Seleccioná tu carrera</option>
      <option>Licenciatura en Nutrición</option>
      <option>Ingeniería en Sistemas</option>
      <option>Contador Público</option>
      <option>Abogacía</option>
      <option>Otra</option>
    </select>
  </div>

  <button class="btn" id="btn-ingresar" onclick="ingresar()">
    <i class="ti ti-arrow-right"></i>
    Comenzar evaluación
  </button>

  <div class="success" id="success">
    <p id="success-msg"></p>
    <span>Redirigiendo a la encuesta...</span>
    <a href="frontnutri.html" class="nav-link"></a>
  </div>
</div>

<script>
function ingresar() {
  const campos = ['nombre', 'apellido', 'curso', 'carrera'];
  let valido = true;

  campos.forEach(id => {
    const el = document.getElementById(id);
    if (!el.value.trim()) {
      el.classList.add('input-error');
      valido = false;
    } else {
      el.classList.remove('input-error');
    }
  });

  if (!valido) return;

  const nombre   = document.getElementById('nombre').value.trim();
  const apellido = document.getElementById('apellido').value.trim();
  const curso    = document.getElementById('curso').value;
  const carrera  = document.getElementById('carrera').value;

  document.getElementById('success-msg').textContent = `¡Bienvenido/a, ${nombre} ${apellido}!`;
  document.getElementById('success').style.display = 'block';
  document.getElementById('btn-ingresar').disabled = true;

  setTimeout(() => {
    const params = new URLSearchParams({ nombre, apellido, curso, carrera });
    window.location.href = 'index.html?' + params.toString();
  }, 1500);
}

['nombre', 'apellido', 'curso', 'carrera'].forEach(id => {
  document.getElementById(id).addEventListener('input', function () {
    this.classList.remove('input-error');
  });
});
</script>

</body>
</html>
