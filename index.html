<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta de comida</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --acento: #e85d26;
      --acento-suave: #fdf1ec;
      --texto: #1a1a18;
      --texto-suave: #6b6b65;
      --borde: #e0ddd8;
      --fondo: #faf9f7;
      --blanco: #ffffff;
      --radio: 12px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    header {
      max-width: 560px;
      margin: 0 auto 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--acento);
      letter-spacing: -0.02em;
    }

    .nav-link {
      font-size: 0.875rem;
      color: var(--texto-suave);
      text-decoration: none;
      border-bottom: 1px solid var(--borde);
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
    }
    .nav-link:hover { color: var(--acento); border-color: var(--acento); }

    .tarjeta {
      background: var(--blanco);
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      padding: 2.5rem;
      max-width: 560px;
      margin: 0 auto;
    }

    .tarjeta-titulo {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      line-height: 1.2;
    }

    .tarjeta-subtitulo {
      color: var(--texto-suave);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .divisor {
      height: 1px;
      background: var(--borde);
      margin: 1.5rem 0;
    }

    .campo {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    input[type="text"],
    textarea {
      width: 100%;
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--texto);
      background: var(--fondo);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--acento);
      box-shadow: 0 0 0 3px rgba(232,93,38,0.12);
    }

    textarea { resize: vertical; min-height: 80px; }

    .slider-grupo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .slider-valor {
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--acento);
      min-width: 2.5rem;
      text-align: right;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 5px;
      border-radius: 99px;
      background: var(--borde);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--acento);
      border: 2px solid white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    .slider-etiquetas {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--texto-suave);
      margin-top: 0.25rem;
      padding: 0 1px;
    }

    .btn-enviar {
      width: 100%;
      padding: 0.85rem;
      background: var(--acento);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-enviar:hover { background: #c94f1f; }
    .btn-enviar:active { transform: scale(0.99); }
    .btn-enviar:disabled { background: var(--borde); color: var(--texto-suave); cursor: not-allowed; }

    .mensaje {
      margin-top: 1rem;
      font-size: 0.875rem;
      text-align: center;
      min-height: 1.25rem;
    }
    .mensaje.exito { color: #0f6e56; }
    .mensaje.error { color: #a32d2d; }
  </style>
</head>
<body>

  <header>
    <span class="logo">Encuesta</span>
    <a href="resultados.html" class="nav-link">Ver resultados →</a>
  </header>

  <div class="tarjeta">
    <h1 class="tarjeta-titulo">¿Cómo estuvo la comida?</h1>
    <p class="tarjeta-subtitulo">Tu opinión nos ayuda a mejorar. Solo lleva un minuto.</p>
    <div class="divisor"></div>

    <form id="form-encuesta">

      <div class="campo">
        <label for="nombre_plato">¿Qué plato comiste?</label>
        <input type="text" id="nombre_plato" placeholder="Ej: milanesa con puré" required>
      </div>

      <div class="divisor"></div>

      <div class="campo">
        <label>Sabor <span id="sabor-val" style="color:var(--acento)">3/5</span></label>
        <div class="slider-grupo">
          <input type="range" id="sabor" min="1" max="5" value="3">
        </div>
        <div class="slider-etiquetas"><span>Malo</span><span>Excelente</span></div>
      </div>

      <div class="campo">
        <label>Presentación <span id="presentacion-val" style="color:var(--acento)">3/5</span></label>
        <div class="slider-grupo">
          <input type="range" id="presentacion" min="1" max="5" value="3">
        </div>
        <div class="slider-etiquetas"><span>Descuidada</span><span>Impecable</span></div>
      </div>

      <div class="campo">
        <label>Temperatura <span id="temperatura-val" style="color:var(--acento)">3/5</span></label>
        <div class="slider-grupo">
          <input type="range" id="temperatura" min="1" max="5" value="3">
        </div>
        <div class="slider-etiquetas"><span>Fría/quemada</span><span>Perfecta</span></div>
      </div>

      <div class="campo">
        <label>Tamaño de porción <span id="porcion-val" style="color:var(--acento)">3/5</span></label>
        <div class="slider-grupo">
          <input type="range" id="porcion" min="1" max="5" value="3">
        </div>
        <div class="slider-etiquetas"><span>Muy poca</span><span>Generosa</span></div>
      </div>

      <div class="divisor"></div>

      <div class="campo">
        <label for="comentario">Comentario (opcional)</label>
        <textarea id="comentario" placeholder="¿Algo más que quieras comentar?"></textarea>
      </div>

      <button type="submit" class="btn-enviar" id="btn-enviar">Enviar encuesta</button>
      <p class="mensaje" id="mensaje"></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/encuesta.js"></script>
</body>
</html>
